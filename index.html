<!DOCTYPE html>
<html>
<head>
<title>ComicCraft</title>
<style>
body{
  background:#fef3c7;
  font-family: Arial;
  text-align:center;
}
h1{ color:#dc2626; }
.box{
  background:white;
  border:3px solid black;
  border-radius:10px;
  width:280px;
  height:300px;
  display:inline-block;
  margin:10px;
  padding:10px;
  vertical-align:top;
}
input{
  width:300px;
  height:40px;
  font-size:16px;
  border:2px solid black;
  border-radius:5px;
  padding:5px;
}
button{
  height:45px;
  background:black;
  color:white;
  border:none;
  border-radius:5px;
  padding:10px 20px;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>
<body>

<h1>ComicCraft 🎨</h1>
<p>Un story-a type pannu, comic ready!</p>

<input type="text" id="story" placeholder="Ex: Cat and dog are friends">
<button onclick="createComic()">Generate</button>

<div id="result" style="margin-top:20px;"></div>

<script>
function createComic(){
  let s = document.getElementById('story').value;
  if(s==""){ alert("Story type pannu da!"); return; }
  
  document.getElementById('result').innerHTML = `
    <div class="box">
      <h3>Panel 1</h3>
      <h1>😺</h1>
      <p>${s}</p>
    </div>
    <div class="box">
      <h3>Panel 2</h3>
      <h1>🐶</h1>
      <p>Aprom enna achu...</p>
    </div>
    <div class="box">
      <h3>Panel 3</h3>
      <h1>😂🎉</h1>
      <p>Happy Ending!</p>
    </div>
  `;
}
</script>

</body>
</html>
